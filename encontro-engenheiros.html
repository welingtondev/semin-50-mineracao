    <!-- Automatic chunk loading error recovery -->
    <script>
      (function() {
        function safeReload() {
          var now = Date.now();
          var lastReload = sessionStorage.getItem('last_chunk_reload');
          if (!lastReload || (now - parseInt(lastReload, 10)) > 10000) {
            sessionStorage.setItem('last_chunk_reload', now.toString());
            window.location.reload();
          }
        }
        window.addEventListener('error', function(e) {
          var msg = e.message || '';
          if (msg.indexOf('Failed to fetch dynamically imported module') !== -1 || msg.indexOf('error loading dynamically imported module') !== -1) {
            safeReload();
          }
        }, true);
      })();
    </script>
